
name: TITAN Global Fixture Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TITAN
        uses: actions/checkout@v4

      - name: Collect worldwide fixtures
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone

          leagues = {
              "England Premier League": "eng.1",
              "England Championship": "eng.2",
              "Spain La Liga": "esp.1",
              "Spain Segunda": "esp.2",
              "Germany Bundesliga": "ger.1",
              "Germany 2 Bundesliga": "ger.2",
              "Italy Serie A": "ita.1",
              "Italy Serie B": "ita.2",
              "France Ligue 1": "fra.1",
              "France Ligue 2": "fra.2",
              "Netherlands Eredivisie": "ned.1",
              "Portugal Liga Portugal": "por.1",
              "Scotland Premiership": "sco.1",
              "USA MLS": "usa.1",
              "Brazil Serie A": "bra.1",
              "Argentina Primera": "arg.1",
              "Mexico Liga MX": "mex.1",
              "UEFA Champions League": "uefa.champions",
              "UEFA Europa League": "uefa.europa",
              "UEFA Conference League": "uefa.europa.conf"
          }

          start = datetime.now(timezone.utc)
          end = start + timedelta(days=7)
          date_range = start.strftime("%Y%m%d") + "-" + end.strftime("%Y%m%d")

          fixtures = {}
          errors = []

          for league, code in leagues.items():
              url = (
                  "https://site.api.espn.com/apis/site/v2/sports/soccer/"
                  + code + "/scoreboard?dates=" + date_range
              )

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 TITAN-AI"}
                  )

                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  for event in data.get("events", []):
                      competition = (event.get("competitions") or [{}])[0]
                      teams = competition.get("competitors", [])

                      home = next(
                          (t for t in teams if t.get("homeAway") == "home"),
                          None
                      )
                      away = next(
                          (t for t in teams if t.get("homeAway") == "away"),
                          None
                      )

                      if not home or not away:
                          continue

                      fixtures[event["id"]] = {
                          "id": event["id"],
                          "home": home["team"]["displayName"],
                          "away": away["team"]["displayName"],
                          "league": league,
                          "date": event.get("date"),
                          "status": competition.get("status", {})
                              .get("type", {}).get("description", "Unknown"),
                          "source": "ESPN"
                      }

              except Exception as error:
                  errors.append({
                      "competition": league,
                      "error": str(error)
                  })

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "source": "ESPN public scoreboard",
              "coverage": {
                  "competitions_attempted": len(leagues),
                  "competitions_failed": len(errors),
                  "fixtures_found": len(fixtures)
              },
              "errors": errors,
              "fixtures": list(fixtures.values())
          }

          with open("fixtures.json", "w", encoding="utf-8") as file:
              json.dump(output, file, indent=2, ensure_ascii=False)

          print(json.dumps(output["coverage"], indent=2))
          print("TITAN fixture collection completed.")
          PY

      - name: Save collected fixtures
        run: |
          git config user.name "TITAN AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || (
            git commit -m "Update TITAN global fixtures" &&
            git push
          )
